name: WallzaOS Mautic plugin checks

on:
  push:
    branches:
      - wallza/marketing-automation-upgrades
    paths:
      - "plugins/MauticBillionMailBundle/**"
      - "composer.json"
      - "composer.lock"
      - "deploy/oracle/**"
      - ".dockerignore"
      - ".github/workflows/wallza-mautic-plugin-checks.yml"

permissions:
  contents: read

jobs:
  php-plugin-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, pdo_mysql
          coverage: none

      - name: Validate root Composer metadata and lock file
        run: composer validate --no-check-publish --no-interaction

      - name: Validate BillionMail plugin Composer metadata
        working-directory: plugins/MauticBillionMailBundle
        run: composer validate --no-check-publish --no-interaction

      - name: Install Mautic dependencies for focused plugin tests
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Run BillionMail PHPUnit tests in Mautic's test environment
        run: php bin/phpunit --bootstrap vendor/autoload.php --configuration app/phpunit.xml.dist plugins/MauticBillionMailBundle/Tests

      - name: Lint plugin PHP files
        run: find plugins/MauticBillionMailBundle -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l

      - name: Build pinned Oracle Mautic image
        run: docker build --pull --file deploy/oracle/Dockerfile --tag wallzaos/mautic:ci .

      - name: Verify runtime plugin location, autoloading and IMAP extension
        run: |
          docker run --rm --entrypoint php wallzaos/mautic:ci -r '
            require "/var/www/html/vendor/autoload.php";
            $classes = [
              "MauticPlugin\\\\MauticBillionMailBundle\\\\MauticBillionMailBundle",
              "MauticPlugin\\\\MauticBillionMailBundle\\\\DependencyInjection\\\\MauticBillionMailExtension",
              "MauticPlugin\\\\MauticBillionMailBundle\\\\Transport\\\\BillionMailTransportFactory",
            ];
            foreach ($classes as $class) {
              if (!class_exists($class)) {
                fwrite(STDERR, "Runtime autoload failed: ".$class.PHP_EOL);
                exit(1);
              }
            }
            if (!extension_loaded("imap")) {
              fwrite(STDERR, "PHP IMAP extension is required for monitored-email processing.".PHP_EOL);
              exit(1);
            }
            echo "BillionMail plugin autoload and PHP IMAP checks passed.".PHP_EOL;
          '

      - name: Test tenant provisioner safety
        run: |
          bash -n deploy/oracle/provision-tenant.sh
          bash -n deploy/oracle/tests/provisioner-smoke.sh
          bash deploy/oracle/tests/provisioner-smoke.sh

      - name: Validate Oracle Compose and tenant cron
        run: |
          test -s deploy/oracle/mautic-cron
          grep -F 'mautic:email:fetch --message-limit=100' deploy/oracle/mautic-cron
          grep -F 'DOCKER_MAUTIC_ROLE: mautic_web' deploy/oracle/compose.yaml
          docker compose --env-file deploy/oracle/.env.example -f deploy/oracle/compose.yaml config --quiet
